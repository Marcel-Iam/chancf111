<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凤姐转运</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #f5f0eb;
    --card: #ffffff;
    --border: #d4cdc4;
    --text: #2c2825;
    --text-light: #7a7269;
    --accent: #b8860b;
    --accent-hover: #9a7209;
    --danger: #c0392b;
    --success: #27ae60;
    --input-bg: #faf8f5;
    --warn-bg: #fff3cd;
    --warn-border: #e6c34d;
    --warn-text: #856404;
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
    overflow: hidden;
  }

  h1 {
    font-weight: 500;
    font-size: 1.5rem;
    margin-bottom: 8px;
    color: var(--accent);
  }

  .subtitle {
    color: var(--text-light);
    font-size: 0.85rem;
    margin-bottom: 28px;
  }

  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .section-title {
    font-weight: 500;
    font-size: 1rem;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .collapse-toggle {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 20px;
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .collapse-toggle:hover {
    border-color: var(--accent);
  }

  .collapse-arrow {
    transition: transform 0.2s;
  }

  .collapse-toggle.active .collapse-arrow {
    transform: rotate(180deg);
  }

  .collapse-box {
    display: none;
  }

  .collapse-box.open {
    display: block;
  }

  .form-row {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }

  .form-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  label {
    font-size: 0.8rem;
    color: var(--text-light);
    margin-bottom: 4px;
  }

  input,
  select,
  textarea {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    font-family: 'Noto Sans SC', sans-serif;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.9rem;
    background: var(--input-bg);
    color: var(--text);
    transition: border-color 0.2s;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  textarea {
    resize: vertical;
    min-height: 50px;
  }

  .product-line {
    width: 100%;
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }

  .product-line select {
    flex: 3;
    min-width: 0;
  }

  .product-line input {
    flex: 1;
    min-width: 0;
  }

  .btn {
    font-family: 'Noto Sans SC', sans-serif;
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }

  .btn-small {
    padding: 4px 10px;
    font-size: 0.8rem;
  }

  .btn-accent {
    background: var(--accent);
    color: #fff;
  }

  .btn-accent:hover {
    background: var(--accent-hover);
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-light);
  }

  .btn-outline:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
  }

  .btn-danger:hover {
    background: var(--danger);
    color: #fff;
  }

  .btn-submit {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    margin-top: 8px;
  }

  .recipient-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 12px;
    background: var(--input-bg);
  }

  .recipient-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .recipient-header span {
    font-weight: 500;
    font-size: 0.9rem;
  }

  .add-recipient-btn {
    width: 100%;
    padding: 10px;
    border: 2px dashed var(--border);
    background: transparent;
    border-radius: 6px;
    color: var(--text-light);
    cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.9rem;
    transition: all 0.2s;
  }

  .add-recipient-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .remove-product-btn {
    flex: 0 0 auto;
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 4px 8px;
    line-height: 1;
  }

  .validation-box {
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    display: none;
  }

  .validation-box.warn {
    display: block;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
  }

  .edit-hint {
    display: none;
    font-size: 0.85rem;
    color: var(--accent);
    margin-top: 8px;
  }

  .button-row {
    display: flex;
    gap: 10px;
  }

  .button-row .btn-submit {
    flex: 1;
  }

  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 20px;
    border-radius: 6px;
    color: #fff;
    font-size: 0.9rem;
    z-index: 999;
    display: none;
    animation: slideIn 0.3s ease;
  }

  .toast.success {
    background: var(--success);
  }

  .toast.error {
    background: var(--danger);
  }

  @keyframes slideIn {
    from {
      transform: translateX(100%);
      opacity: 0;
    }
    to {
      transform: translateX(0);
      opacity: 1;
    }
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 998;
  }

  .loading-overlay.active {
    display: flex;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #fff;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.42);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
  }

  .confirm-overlay.active {
    display: flex;
  }

  .confirm-box {
    width: 100%;
    max-width: 430px;
    background: #fff;
    border-radius: 10px;
    padding: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  }

  .confirm-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--danger);
  }

  .confirm-message {
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 18px;
  }

  .confirm-actions {
    display: flex;
    gap: 10px;
  }

  .confirm-actions .btn {
    flex: 1;
    padding: 10px;
  }

  @media (max-width: 700px) {
    body {
      padding: 12px;
    }

    .section {
      padding: 16px;
    }

    .form-row {
      flex-direction: column;
      gap: 8px;
    }

    .product-line {
      align-items: center;
    }

    .button-row,
    .confirm-actions {
      flex-direction: column;
      gap: 8px;
    }
  }
</style>
</head>

<body>
<div class="container">
  <h1>凤姐转运</h1>
  <p class="subtitle">填写来件信息，并添加收件人</p>

  <button id="editCollapseBtn" class="collapse-toggle" onclick="toggleEditBox()">
    <span>修改订单资料</span>
    <span class="collapse-arrow">▼</span>
  </button>

  <div id="editCollapseBox" class="collapse-box">
    <div class="section">
      <div class="section-title">修改订单资料</div>

      <div class="form-row">
        <div class="form-group">
          <label>订单号</label>
          <input type="text" id="searchExpressCode" placeholder="输入要修改的订单号">
        </div>

        <div class="form-group">
          <label>&nbsp;</label>
          <button class="btn btn-accent" onclick="searchOrderForEdit()">搜寻</button>
        </div>
      </div>

      <div id="editModeHint" class="edit-hint">
        当前正在修改订单资料。修改完成后，请点击页面底部的“发送修改”。
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">来件信息</div>

    <div class="form-row">
  <div class="form-group">
    <label>填表人称呼</label>
    <input type="text" id="createdBy" placeholder="例如：小陈、阿明">
  </div>
</div>

<div class="form-row">
  <div class="form-group">
    <label>订单号</label>
    <input type="text" id="expressCode" placeholder="输入订单号">
  </div>

  <div class="form-group">
    <label>取货码</label>
    <input type="text" id="pickupCode" placeholder="输入取货码">
  </div>
</div>

    <label>来件产品</label>
    <div id="incomingProducts"></div>

    <button class="btn btn-outline btn-small" onclick="addIncomingProduct()" style="margin-top:4px;">
      + 添加产品
    </button>
  </div>

  <div class="section">
    <div class="section-title">收件人信息</div>

    <div id="recipientList"></div>

    <button class="add-recipient-btn" onclick="addRecipient()">
      + 添加收件人
    </button>
  </div>

  <div id="validationBox" class="validation-box"></div>

  <button id="submitBtn" class="btn btn-accent btn-submit" onclick="submitOrder()">
    提交订单
  </button>

  <div id="editButtons" class="button-row" style="display:none;">
    <button class="btn btn-accent btn-submit" onclick="updateOrder()">
      发送修改
    </button>

    <button class="btn btn-outline btn-submit" onclick="cancelEditMode()">
      取消修改
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
</div>

<div class="confirm-overlay" id="quantityConfirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title">产品数量不匹配</div>
    <div id="quantityConfirmMessage" class="confirm-message"></div>

    <div class="confirm-actions">
      <button class="btn btn-outline" onclick="cancelQuantityConfirm()">
        取消，返回修改
      </button>

      <button class="btn btn-accent" onclick="confirmQuantityMismatchSubmit()">
        仍然提交
      </button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 配置区域
// owner: GitHub 用户名
// repo:  仓库名
// _k:    加密后的 token
// ============================================================

const CONFIG = {
  owner: 'Marcel-Iam',
  repo: 'chancf111',
  _k: '8.26.20.58.38.53.15.37.120.35.73.107.98.0.13.56.74.6.22.59.10.64.71.45.16.55.89.118.98.126.40.74.9.12.70.99.52.36.47.84',
};

function _d(s) {
  var k = 'orderSysKey2025';
  return s.split('.').map(function(n, i) {
    return String.fromCharCode(parseInt(n) ^ k.charCodeAt(i % k.length));
  }).join('');
}

const TOKEN = _d(CONFIG._k);
const API = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents`;
const HEADERS = {
  'Content-Type': 'application/json',
  'Authorization': `token ${TOKEN}`
};

let products = [];
let recipientCount = 0;
let editingOrderId = null;
let editingExpressCode = null;

let pendingSubmitAction = null;
let pendingExistingOrder = null;

// -----------------------------
// 初始化
// -----------------------------

async function init() {
  try {
    products = await fetchFile('products.json');
    resetForm();
  } catch (e) {
    showToast('无法加载产品列表: ' + e.message, 'error');
  }
}

// -----------------------------
// GitHub 文件读写
// -----------------------------

function decodeB64(str) {
  const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function encodeB64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

async function fetchFile(path) {
  const res = await fetch(`${API}/${path}`, { headers: HEADERS });

  if (!res.ok) {
    throw new Error('读取失败');
  }

  const data = await res.json();
  return JSON.parse(decodeB64(data.content));
}

async function fetchFileWithSha(path) {
  const res = await fetch(`${API}/${path}`, { headers: HEADERS });

  if (!res.ok) {
    throw new Error('读取失败');
  }

  const data = await res.json();

  return {
    content: JSON.parse(decodeB64(data.content)),
    sha: data.sha
  };
}

async function updateFile(path, content, sha, message) {
  const res = await fetch(`${API}/${path}`, {
    method: 'PUT',
    headers: HEADERS,
    body: JSON.stringify({
      content: encodeB64(JSON.stringify(content, null, 2)),
      sha,
      message
    })
  });

  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.message || '写入失败');
  }

  return res.json();
}

async function writeOrderWithRetry(newOrder, maxRetries = 3) {
  for (let i = 0; i < maxRetries; i++) {
    try {
      const { content: orders, sha } = await fetchFileWithSha('orders.json');

      orders.push(newOrder);

      await updateFile(
        'orders.json',
        orders,
        sha,
        `新订单 ${newOrder.incoming.express_code}`
      );

      return true;
    } catch (e) {
      if (i === maxRetries - 1) {
        throw e;
      }

      await wait(500 * (i + 1));
    }
  }
}

async function updateOrderWithRetry(updatedOrder, maxRetries = 3) {
  for (let i = 0; i < maxRetries; i++) {
    try {
      const { content: orders, sha } = await fetchFileWithSha('orders.json');

      const index = orders.findIndex(o =>
        o.id === editingOrderId ||
        o.incoming?.express_code === editingExpressCode
      );

      if (index === -1) {
        throw new Error('找不到原订单，无法修改');
      }

      orders[index] = updatedOrder;

      await updateFile(
        'orders.json',
        orders,
        sha,
        `修改订单 ${updatedOrder.incoming.express_code}`
      );

      return true;
    } catch (e) {
      if (i === maxRetries - 1) {
        throw e;
      }

      await wait(500 * (i + 1));
    }
  }
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// -----------------------------
// HTML 工具
// -----------------------------

function esc(v = '') {
  return String(v).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function productOptions(selectedId = '') {
  return products.map(p => {
    const selected = p.id === selectedId ? 'selected' : '';
    return `<option value="${esc(p.id)}" ${selected}>${esc(p.name)}</option>`;
  }).join('');
}

// -----------------------------
// 折叠修改订单区域
// -----------------------------

function toggleEditBox() {
  const btn = document.getElementById('editCollapseBtn');
  const box = document.getElementById('editCollapseBox');

  btn.classList.toggle('active');
  box.classList.toggle('open');
}

// -----------------------------
// 表格操作
// -----------------------------

function addIncomingProduct(productId = '', quantity = '') {
  const c = document.getElementById('incomingProducts');
  const d = document.createElement('div');

  d.className = 'product-line';

  d.innerHTML = `
    <select>
      <option value="">请选择产品</option>
      ${productOptions(productId)}
    </select>

    <input type="number" min="1" value="${quantity || ''}" placeholder="数量">

    <button class="remove-product-btn" onclick="this.parentElement.remove()">×</button>
  `;

  c.appendChild(d);
}

function addRecipient(data = null) {
  recipientCount++;

  const c = document.getElementById('recipientList');
  const d = document.createElement('div');
  const n = recipientCount;

  d.className = 'recipient-card';
  d.id = `recipient-${n}`;

  d.innerHTML = `
    <div class="recipient-header">
      <span>收件人 #${n}</span>
      <button class="btn btn-danger btn-small" onclick="removeRecipient(${n})">删除</button>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>姓名</label>
        <input type="text" class="r-name" placeholder="收件人姓名" value="${esc(data?.name || '')}">
      </div>

      <div class="form-group">
        <label>联系电话</label>
        <input type="text" class="r-phone" placeholder="电话号码" value="${esc(data?.phone || '')}">
      </div>
    </div>

    <div class="form-group" style="margin-bottom:12px;">
      <label>地址</label>
      <input type="text" class="r-address" placeholder="收件地址" value="${esc(data?.address || '')}">
    </div>

    <label>产品</label>
    <div class="r-products"></div>

    <button class="btn btn-outline btn-small" onclick="addRecipientProduct(${n})" style="margin-top:4px;margin-bottom:8px;">
      + 添加产品
    </button>

    <div class="form-group">
      <label>备注</label>
      <textarea class="r-notes" placeholder="备注（选填）">${esc(data?.notes || '')}</textarea>
    </div>
  `;

  c.appendChild(d);

  if (data && Array.isArray(data.products) && data.products.length > 0) {
    data.products.forEach(p => {
      addRecipientProduct(n, p.product_id, p.quantity);
    });
  } else {
    addRecipientProduct(n);
  }
}

function removeRecipient(n) {
  const el = document.getElementById(`recipient-${n}`);

  if (el) {
    el.remove();
  }
}

function addRecipientProduct(n, productId = '', quantity = '') {
  const card = document.getElementById(`recipient-${n}`);

  if (!card) {
    return;
  }

  const c = card.querySelector('.r-products');
  const d = document.createElement('div');

  d.className = 'product-line';

  d.innerHTML = `
    <select>
      <option value="">请选择产品</option>
      ${productOptions(productId)}
    </select>

    <input type="number" min="1" value="${quantity || ''}" placeholder="数量">

    <button class="remove-product-btn" onclick="this.parentElement.remove()">×</button>
  `;

  c.appendChild(d);
}

function resetForm() {
  document.getElementById('createdBy').value = '';
  document.getElementById('expressCode').value = '';
  document.getElementById('pickupCode').value = '';
  document.getElementById('incomingProducts').innerHTML = '';
  document.getElementById('recipientList').innerHTML = '';
  clearValidation();

  recipientCount = 0;

  addIncomingProduct();
  addRecipient();
}

// -----------------------------
// 数量统计与校验
// -----------------------------

function getIncomingTotals() {
  const t = {};

  document.querySelectorAll('#incomingProducts .product-line').forEach(l => {
    const id = l.querySelector('select').value;
    const q = parseInt(l.querySelector('input').value) || 0;

    if (id && q > 0) {
      t[id] = (t[id] || 0) + q;
    }
  });

  return t;
}

function getOutgoingTotals() {
  const t = {};

  document.querySelectorAll('.recipient-card .r-products .product-line').forEach(l => {
    const id = l.querySelector('select').value;
    const q = parseInt(l.querySelector('input').value) || 0;

    if (id && q > 0) {
      t[id] = (t[id] || 0) + q;
    }
  });

  return t;
}

function getQuantityMismatches() {
  const inc = getIncomingTotals();
  const out = getOutgoingTotals();

  const allIds = new Set([
    ...Object.keys(inc),
    ...Object.keys(out)
  ]);

  const mismatches = [];

  for (const id of allIds) {
    const incomingQty = inc[id] || 0;
    const outgoingQty = out[id] || 0;

    if (incomingQty !== outgoingQty) {
      const name = products.find(p => p.id === id)?.name || id;
      mismatches.push(`${name}: 来件 ${incomingQty}, 收件合计 ${outgoingQty}`);
    }
  }

  return mismatches;
}

function showQuantityMismatchConfirm(mismatches, action, existingOrder = null) {
  pendingSubmitAction = action;
  pendingExistingOrder = existingOrder;

  const msg = document.getElementById('quantityConfirmMessage');

  msg.innerHTML = `
    以下产品数量不匹配：<br><br>
    ${mismatches.map(m => esc(m)).join('<br>')}
    <br><br>
    是否仍然继续提交？
  `;

  document.getElementById('quantityConfirmOverlay').classList.add('active');
}

function cancelQuantityConfirm() {
  pendingSubmitAction = null;
  pendingExistingOrder = null;

  document.getElementById('quantityConfirmOverlay').classList.remove('active');
}

async function confirmQuantityMismatchSubmit() {
  const action = pendingSubmitAction;
  const existingOrder = pendingExistingOrder;

  document.getElementById('quantityConfirmOverlay').classList.remove('active');

  pendingSubmitAction = null;
  pendingExistingOrder = null;

  if (action === 'create') {
    await reallySubmitOrder(true);
  }

  if (action === 'update') {
    await reallyUpdateOrder(existingOrder, true);
  }
}

function clearValidation() {
  const box = document.getElementById('validationBox');
  box.className = 'validation-box';
  box.innerHTML = '';
}

function showValidationWarning(mismatches) {
  const box = document.getElementById('validationBox');

  box.className = 'validation-box warn';
  box.innerHTML = '<strong>产品数量不匹配：</strong><br>' + mismatches.map(m => esc(m)).join('<br>');
}

// -----------------------------
// 收集表格资料
// -----------------------------

function collectOrderData(existingOrder = null) {
  clearValidation();

  const createdBy = document.getElementById('createdBy').value.trim();
  const expressCode = document.getElementById('expressCode').value.trim();
  const pickupCode = document.getElementById('pickupCode').value.trim();

  if (!createdBy) {
    showToast('请填写填表人称呼', 'error');
    return null;
  }

  if (!expressCode || !pickupCode) {
    showToast('请填写订单号和取货码', 'error');
    return null;
  }

  const incomingProducts = [];

  document.querySelectorAll('#incomingProducts .product-line').forEach(l => {
    const sel = l.querySelector('select');
    const q = parseInt(l.querySelector('input').value) || 0;

    if (sel.value && q > 0) {
      const prod = products.find(p => p.id === sel.value);

      incomingProducts.push({
        product_id: sel.value,
        name: prod ? prod.name : sel.value,
        quantity: q
      });
    }
  });

  if (incomingProducts.length === 0) {
    showToast('请至少添加一个来件产品', 'error');
    return null;
  }

  const outgoing = [];

  for (const card of document.querySelectorAll('.recipient-card')) {
    const name = card.querySelector('.r-name').value.trim();
    const phone = card.querySelector('.r-phone').value.trim();
    const address = card.querySelector('.r-address').value.trim();
    const notes = card.querySelector('.r-notes').value.trim();

    const hasRecipientInfo = name || phone || address;
    const rp = [];

    card.querySelectorAll('.r-products .product-line').forEach(l => {
      const sel = l.querySelector('select');
      const q = parseInt(l.querySelector('input').value) || 0;

      if (sel.value && q > 0) {
        const prod = products.find(p => p.id === sel.value);

        rp.push({
          product_id: sel.value,
          name: prod ? prod.name : sel.value,
          quantity: q
        });
      }
    });

    if (!hasRecipientInfo && rp.length === 0 && !notes) {
      continue;
    }

    outgoing.push({
      name,
      phone,
      address,
      products: rp,
      notes
    });
  }

  const base = existingOrder || {};

  return {
    ...base,
    id: base.id || 'ORD_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
    created_at: base.created_at || new Date().toISOString(),
    created_by: createdBy,
    status: base.status || '待处理',
    picked_up: base.picked_up ?? false,
    shipped: base.shipped ?? false,
    incoming: {
      express_code: expressCode,
      pickup_code: pickupCode,
      products: incomingProducts
    },
    outgoing
  };
}

// -----------------------------
// 新增订单
// -----------------------------

async function submitOrder() {
  const draftOrder = collectOrderData(null);

  if (!draftOrder) {
    return;
  }

  const mismatches = getQuantityMismatches();

  if (mismatches.length > 0) {
    showValidationWarning(mismatches);
    showQuantityMismatchConfirm(mismatches, 'create');
    return;
  }

  await reallySubmitOrder(false);
}

async function reallySubmitOrder(skipQuantityCheck = false) {
  const order = collectOrderData(null);

  if (!order) {
    return;
  }

  if (!skipQuantityCheck) {
    const mismatches = getQuantityMismatches();

    if (mismatches.length > 0) {
      showValidationWarning(mismatches);
      showQuantityMismatchConfirm(mismatches, 'create');
      return;
    }
  }

  showLoading(true);

  try {
    await writeOrderWithRetry(order);

    showToast('订单提交成功！', 'success');
    resetForm();
  } catch (e) {
    showToast('提交失败: ' + e.message, 'error');
  }

  showLoading(false);
}

// -----------------------------
// 修改订单
// -----------------------------

async function searchOrderForEdit() {
  const code = document.getElementById('searchExpressCode').value.trim();

  if (!code) {
    showToast('请输入要修改的订单号', 'error');
    return;
  }

  showLoading(true);

  try {
    const orders = await fetchFile('orders.json');

    const order = orders.find(o =>
      o.incoming?.express_code === code ||
      o.id === code
    );

    if (!order) {
      showToast('找不到这个订单号', 'error');
      showLoading(false);
      return;
    }

    editingOrderId = order.id;
    editingExpressCode = order.incoming?.express_code || '';

    fillFormWithOrder(order);
    enterEditMode();

    showToast('订单资料已载入，可以开始修改', 'success');
  } catch (e) {
    showToast('搜寻失败: ' + e.message, 'error');
  }

  showLoading(false);
}

function fillFormWithOrder(order) {
  document.getElementById('createdBy').value = order.created_by || '';
  document.getElementById('expressCode').value = order.incoming?.express_code || '';
  document.getElementById('pickupCode').value = order.incoming?.pickup_code || '';
  document.getElementById('incomingProducts').innerHTML = '';
  document.getElementById('recipientList').innerHTML = '';
  clearValidation();

  recipientCount = 0;

  const incomingProducts = order.incoming?.products || [];

  if (incomingProducts.length > 0) {
    incomingProducts.forEach(p => {
      addIncomingProduct(p.product_id, p.quantity);
    });
  } else {
    addIncomingProduct();
  }

  const outgoing = order.outgoing || [];

  if (outgoing.length > 0) {
    outgoing.forEach(r => {
      addRecipient(r);
    });
  } else {
    addRecipient();
  }
}

function enterEditMode() {
  const btn = document.getElementById('editCollapseBtn');
  const box = document.getElementById('editCollapseBox');

  btn.classList.add('active');
  box.classList.add('open');

  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('editButtons').style.display = 'flex';
  document.getElementById('editModeHint').style.display = 'block';
}

function cancelEditMode() {
  editingOrderId = null;
  editingExpressCode = null;

  document.getElementById('searchExpressCode').value = '';
  document.getElementById('submitBtn').style.display = 'block';
  document.getElementById('editButtons').style.display = 'none';
  document.getElementById('editModeHint').style.display = 'none';

  resetForm();
}

async function updateOrder() {
  if (!editingOrderId && !editingExpressCode) {
    showToast('请先搜寻要修改的订单', 'error');
    return;
  }

  showLoading(true);

  try {
    const { content: orders } = await fetchFileWithSha('orders.json');

    const existingOrder = orders.find(o =>
      o.id === editingOrderId ||
      o.incoming?.express_code === editingExpressCode
    );

    showLoading(false);

    if (!existingOrder) {
      showToast('找不到原订单，无法修改', 'error');
      return;
    }

    const draftOrder = collectOrderData(existingOrder);

    if (!draftOrder) {
      return;
    }

    const mismatches = getQuantityMismatches();

    if (mismatches.length > 0) {
      showValidationWarning(mismatches);
      showQuantityMismatchConfirm(mismatches, 'update', existingOrder);
      return;
    }

    await reallyUpdateOrder(existingOrder, false);
  } catch (e) {
    showLoading(false);
    showToast('修改失败: ' + e.message, 'error');
  }
}

async function reallyUpdateOrder(existingOrder, skipQuantityCheck = false) {
  const updatedOrder = collectOrderData(existingOrder);

  if (!updatedOrder) {
    return;
  }

  if (!skipQuantityCheck) {
    const mismatches = getQuantityMismatches();

    if (mismatches.length > 0) {
      showValidationWarning(mismatches);
      showQuantityMismatchConfirm(mismatches, 'update', existingOrder);
      return;
    }
  }

  showLoading(true);

  try {
    await updateOrderWithRetry(updatedOrder);

    showToast('订单修改成功！', 'success');
    cancelEditMode();
  } catch (e) {
    showToast('修改失败: ' + e.message, 'error');
  }

  showLoading(false);
}

// -----------------------------
// UI 提示
// -----------------------------

function showToast(msg, type) {
  const t = document.getElementById('toast');

  t.textContent = msg;
  t.className = 'toast ' + type;
  t.style.display = 'block';

  setTimeout(() => {
    t.style.display = 'none';
  }, 3500);
}

function showLoading(on) {
  document.getElementById('loading').classList.toggle('active', on);
}

init();
</script>
